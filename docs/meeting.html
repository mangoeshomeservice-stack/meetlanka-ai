<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEET UP · Meeting Room Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070f23;color:#f7faff;font:15px Inter,Segoe UI,Arial,sans-serif}button{font:inherit;cursor:pointer}header{height:75px;background:#0b1834;border-bottom:1px solid #243a66;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:15px}.brand{font-weight:900;font-size:24px}.brand span{color:#46b9ff}.sub{color:#9eb4d4;font-size:12px;margin-top:5px}.top-right{display:flex;align-items:center;gap:12px}.pill{background:#153361;border:1px solid #31588d;border-radius:30px;padding:8px 13px}.back{background:none;border:1px solid #385587;color:#d5e7ff;border-radius:9px;padding:9px 14px}.workspace{display:flex;min-height:calc(100vh - 165px)}.stage{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;gap:16px;background:radial-gradient(ellipse at 75% 30%,#2a215877,transparent 60%),#08142b}.room-info{display:flex;justify-content:space-between;color:#b3c9e8;gap:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(180px,1fr));gap:15px;flex:1}.tile{background:linear-gradient(140deg,#182f61,#121a38);border:1px solid #34518a;border-radius:20px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.tile:nth-child(2){background:linear-gradient(140deg,#24336e,#3a236b)}.tile:nth-child(3){background:linear-gradient(140deg,#0d4d70,#1b2b57)}.tile:nth-child(4){background:linear-gradient(140deg,#3a285e,#172b55)}.avatar{height:95px;width:95px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:800;background:linear-gradient(120deg,#07baf4,#8052fa);box-shadow:0 8px 40px #080e2588}.tile label{position:absolute;bottom:15px;left:16px;background:#09162abb;padding:7px 12px;border-radius:9px}.tile .signal{position:absolute;top:15px;right:16px;color:#9bc9ff}.side{width:320px;background:#0d1a37;border-left:1px solid #294477;display:flex;flex-direction:column}.tabs{display:flex;border-bottom:1px solid #28416d}.tabs button{flex:1;padding:20px 5px;background:none;border:0;color:#9cb2d1}.tabs button.active{color:#fff;border-bottom:3px solid #34baff}.side-content{flex:1;padding:18px;overflow:auto}.person{padding:13px;background:#17294d;border-radius:12px;margin-bottom:10px}.message{margin-bottom:16px;line-height:1.5}.message strong{display:block;color:#69d0ff}.chat-entry{display:flex;gap:8px;padding:14px;border-top:1px solid #28416d}.chat-entry input{flex:1;min-width:0;border-radius:9px;background:#08142b;border:1px solid #395a8b;padding:11px;color:white}.chat-entry button{border:0;border-radius:9px;background:#187ae8;color:white;padding:10px}.controls{background:#0a1731;border-top:1px solid #27406c;min-height:90px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;padding:14px}.control{background:#1c3157;border:1px solid #385583;color:white;border-radius:13px;min-width:90px;padding:10px 13px}.control strong{display:block;font-size:23px;margin-bottom:3px}.control.off{background:#713049;border-color:#b85070}.control.end{background:#d83e56;border-color:#d83e56}.notice{color:#c2d7ef;text-align:center;font-size:12px;padding:8px;background:#0d2348}#toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#214d82;color:white;padding:12px 20px;border-radius:12px;display:none;max-width:90%;text-align:center}@media(max-width:850px){.workspace{flex-direction:column}.side{width:100%;min-height:280px}.grid{grid-template-rows:repeat(2,180px)}.stage{padding:12px}.top-right .pill{display:none}.control{min-width:70px;padding:8px;font-size:12px}header{padding:0 12px}.room-info{font-size:12px}}
</style></head><body>
<header><div><div class="brand">MEET <span>UP</span></div><div class="sub">Meeting Room · Design Preview</div></div><div class="top-right"><span class="pill">🔒 Demo Meeting · 4 participants</span><button class="back" onclick="location.href='./'">← Home</button></div></header>
<div class="workspace"><main class="stage"><div class="room-info"><span>Meeting: MEET-UP-DEMO</span><span>Gallery View · Preview</span></div><div class="grid"><div class="tile"><div class="avatar">YOU</div><label>You (Host)</label><span class="signal" id="my-status">🎙</span></div><div class="tile"><div class="avatar">AS</div><label>Alex Silva</label><span class="signal">🎙</span></div><div class="tile"><div class="avatar">SK</div><label>Sarah Kim</label><span class="signal">🔇</span></div><div class="tile"><div class="avatar">JD</div><label>Jordan Davis</label><span class="signal">🎙</span></div></div></main>
<aside class="side"><div class="tabs"><button id="participants-tab" class="active" onclick="tab('participants')">Participants (4)</button><button id="chat-tab" onclick="tab('chat')">Chat</button></div><div class="side-content" id="side-content"></div><div class="chat-entry" id="chat-entry" hidden><input id="chat-input" placeholder="Message everyone" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div></aside></div>
<div class="controls"><button class="control" id="mic" onclick="toggle('mic','🎙','🔇','Microphone')"><strong>🎙</strong>Mic</button><button class="control" id="camera" onclick="toggle('camera','📹','🚫','Camera')"><strong>📹</strong>Camera</button><button class="control" onclick="notify('Screen sharing works inside the desktop meeting, not this visual preview.')"><strong>▤</strong>Share</button><button class="control" onclick="tab('participants')"><strong>♧</strong>People</button><button class="control" onclick="tab('chat')"><strong>▤</strong>Chat</button><button class="control" onclick="notify('Demo meeting link copied is not supported: this is a visual preview.')"><strong>🔗</strong>Invite</button><button class="control end" onclick="location.href='./'"><strong>☎</strong>Leave</button></div>
<div class="notice">Interactive UI prototype only · No real audio, video, screen sharing or meeting connection</div><div id="toast" role="status"></div>
<script>
const people=['You (Host)','Alex Silva','Sarah Kim','Jordan Davis'];const messages=[['Alex Silva','Hello everyone!'],['Sarah Kim','Ready for the meeting.']];let active='participants';
function tab(name){active=name;document.getElementById('participants-tab').classList.toggle('active',name==='participants');document.getElementById('chat-tab').classList.toggle('active',name==='chat');document.getElementById('chat-entry').hidden=name!=='chat';document.getElementById('side-content').innerHTML=name==='participants'?people.map(p=>'<div class="person">● &nbsp; '+p+'</div>').join(''):messages.map(m=>'<div class="message"><strong>'+m[0]+'</strong><span></span></div>').join('');if(name==='chat')document.querySelectorAll('.message span').forEach((el,i)=>el.textContent=messages[i][1]);}
function send(){const el=document.getElementById('chat-input');if(!el.value.trim())return;messages.push(['You',el.value.trim()]);el.value='';tab('chat');}
function toggle(id,on,off,name){const el=document.getElementById(id);const disabled=el.classList.toggle('off');el.querySelector('strong').textContent=disabled?off:on;notify(name+' '+(disabled?'muted / off':'on')+' (visual simulation only)');if(id==='mic')document.getElementById('my-status').textContent=disabled?'🔇':'🎙';}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';}
tab('participants');
</script></body></html>
